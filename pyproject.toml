[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "analytics-service-toolkit"
version = "0.1.0"
description = "Shared settings/DB/alerting/dashboard-chrome toolkit for Python data services. No business logic — import only."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Nassim K." }]
dependencies = [
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "sqlalchemy>=2.0",
    "pandas>=2.0",
    "httpx>=0.27",
    "typer>=0.12",
]

[project.optional-dependencies]
streamlit = ["streamlit>=1.32"]
postgres = ["psycopg2-binary>=2.9"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "streamlit>=1.32",
]

[project.scripts]
astk = "astk.cli:app"

[project.urls]
Repository = "https://github.com/nassim0014/analytics-service-toolkit"

[tool.hatch.build.targets.wheel]
packages = ["src/astk"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
